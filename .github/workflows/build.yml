name: build zygote image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - guest-init.sh
      - vsock-bridge.py
      - '*.service'
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64 — matches the piebox VM
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/qretaio/debian:latest
            ghcr.io/qretaio/debian:trixie
          cache-from: type=gha
          cache-to: type=gha,mode=max
